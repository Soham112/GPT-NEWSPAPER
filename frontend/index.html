<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLR8 Research - AI-Powered Research Agent</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="container" style="max-width: 100%; padding: 0;">
        <!-- Header -->
        <header style="text-align: center; padding: var(--space-lg) var(--space-md); border-bottom: 1px solid var(--border, rgba(0, 0, 0, 0.1));">
            <h1 style="letter-spacing: -0.03em; margin-bottom: var(--space-xs);">XLR8 Research</h1>
            <div style="margin-top: var(--space-sm);">
                <a href="/outreach.html" class="btn btn--ghost btn--small">Outreach Agent</a>
            </div>
        </header>

        <!-- Chat Interface -->
        <section class="chat-interface">
            <!-- Initial State: Centered Input -->
            <div id="initialState" class="initial-state">
                <div class="initial-state__content">
                    <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: var(--space-md); color: var(--text);">Ready when you are</h2>
                    <div class="topic-input-group topic-input-group--centered">
                        <button 
                            type="button" 
                            id="addTopicBtn" 
                            class="topic-add-btn"
                            aria-label="Add topic"
                            style="pointer-events: none; opacity: 0.5;"
                        >+</button>
                        <input 
                            type="text" 
                            id="topicInput" 
                            class="input topic-input topic-input--large" 
                            placeholder="Ask anything"
                            autocomplete="off"
                        >
                        <button 
                            type="button" 
                            id="produceNewspaper" 
                            class="btn btn--primary"
                            style="min-width: 100px;"
                        >
                            Search
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results Container (Hidden initially) -->
            <div id="resultsContainer" class="chat-results hidden">
                <!-- Results will be injected here -->
            </div>

            <!-- Input Area (Fixed at bottom, hidden initially) -->
            <div id="chatInputContainer" class="chat-input-container hidden">
                <div class="topic-input-group">
                    <button 
                        type="button" 
                        id="addTopicBtnBottom" 
                        class="topic-add-btn"
                        aria-label="Add topic"
                        style="pointer-events: none; opacity: 0.5;"
                    >+</button>
                    <input 
                        type="text" 
                        id="topicInputBottom" 
                        class="input topic-input" 
                        placeholder="Ask anything"
                        autocomplete="off"
                    >
                    <button 
                        type="button" 
                        id="produceNewspaperBottom" 
                        class="btn btn--primary"
                        style="min-width: 80px;"
                    >
                        Search
                    </button>
                </div>
            </div>
        </section>

    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="loader hidden" role="status" aria-live="polite">
        <div class="loader__ring" aria-hidden="true"></div>
        <div class="loader__text" id="loadingText">Looking for news...</div>
    </div>

    <!-- Toast for Errors -->
    <div id="toast" class="toast hidden" role="alert" aria-live="assertive"></div>

    <script src="static/scripts.js"></script>
</body>
</html>
