<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLR8 Research - AI-Powered Research Agent</title>
    <link rel="stylesheet" href="static/styles.css">
    <link rel="icon" type="image/x-icon" href="static/favicon.ico">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header style="text-align: center; padding: var(--space-xl) 0;">
            <h1 style="letter-spacing: -0.03em;">XLR8 Research</h1>
            <p class="subtitle">Type any topic: finance, solar energy, powergrid, property tech, AI, etc.</p>
        </header>

        <!-- Topic Selection -->
        <section class="topic-selection">
            <div class="topic-input-group">
                <input 
                    type="text" 
                    id="topicInput" 
                    class="input topic-input" 
                    placeholder="Enter a topic..."
                    autocomplete="off"
                >
                <button 
                    type="button" 
                    id="addTopicBtn" 
                    class="topic-add-btn"
                    aria-label="Add topic"
                >+</button>
            </div>
            
            <!-- Topic Chips -->
            <div id="topicChips" class="topic-input-group" style="margin-top: var(--space-sm);"></div>

            <!-- Layout Selection -->
            <div style="margin: var(--space-lg) 0;">
                <p class="muted" style="margin-bottom: var(--space-sm);">Select newspaper layout</p>
                <div class="pill-toggle" role="group" aria-label="Layout selection">
                    <button 
                        type="button" 
                        class="pill-toggle__item pill-toggle__item--active" 
                        data-layout="layout_1.html"
                        aria-label="Layout 1"
                    >Layout 1</button>
                    <button 
                        type="button" 
                        class="pill-toggle__item" 
                        data-layout="layout_2.html"
                        aria-label="Layout 2"
                    >Layout 2</button>
                    <button 
                        type="button" 
                        class="pill-toggle__item" 
                        data-layout="layout_3.html"
                        aria-label="Layout 3"
                    >Layout 3</button>
                </div>
            </div>

            <!-- Primary CTA -->
            <div style="text-align: center; margin: var(--space-xl) 0;">
                <button 
                    type="button" 
                    id="produceNewspaper" 
                    class="btn btn--primary"
                    style="min-width: 200px;"
                >
                    Produce Newspaper
                </button>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p class="muted">Grounded summaries with live sources.</p>
        </footer>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="loader hidden" role="status" aria-live="polite">
        <div class="loader__ring" aria-hidden="true"></div>
        <div class="loader__text" id="loadingText">Looking for news...</div>
    </div>

    <!-- Toast for Errors -->
    <div id="toast" class="toast hidden" role="alert" aria-live="assertive"></div>

    <script src="static/scripts.js"></script>
</body>
</html>
